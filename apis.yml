  detail: >-
    Dean Foods filed Chapter 11 on 2019-11-12 and its plants and brands were sold to
    Dairy Farmers of America in May 2020; the company has no operating surface left to
    profile — deanfoods.com is now registered to Dairy Farmers of America, Inc., serves
    no HTTPS at all (the TLS handshake to port 443 aborts with "tlsv1 alert internal
    error", so every https probe returns 0 rather than a status code), and over plain
    HTTP answers 301 to https://www.dfamilk.com/ for every path including
    /openapi.json, /llms.txt and all seven /.well-known/ paths, while no api.,
    developer., docs. or portal. subdomain resolves on either deanfoods.com or
    dfamilk.com and no GitHub organization exists under any spelling of the name.
