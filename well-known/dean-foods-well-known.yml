# Dean Foods — /.well-known/ probe. RECORDED ABSENCE.
#
# Dean Foods filed Chapter 11 in November 2019 and its assets were sold to Dairy
# Farmers of America (DFA) in May 2020. The company no longer operates, and no
# host in this record serves any /.well-known/ document.
#
# TWO DISTINCT ABSENCES ARE RECORDED HERE, and they are different facts:
#
#   deanfoods.com / www.deanfoods.com — the domain is still registered (registrant
#   of record: Dairy Farmers of America, Inc.; registry expiry 2027-04-05) and still
#   resolves, but there is NO HTTPS LISTENER: a TLS handshake to port 443 aborts with
#   "tlsv1 alert internal error", so every https:// probe returns status 0 (no
#   connection, never an HTTP response). Over plain HTTP the host is a blanket
#   redirector: EVERY path, including every /.well-known/ path, answers 301 to
#   https://www.dfamilk.com/ — it is a brand-parking redirect, not a served document.
#
#   dfamilk.com / www.dfamilk.com — the SUCCESSOR company's live site (IIS/ASP.NET).
#   It is probed here only because apis.yml carries a Successor pointer to it. It
#   returns a hard 404 on every /.well-known/ path, and a control probe of a path
#   that cannot exist (/zzz-soft404-control-probe) also returns 404, so these are
#   genuine 404s and not soft-404s scoring as absence. NOTE: dfamilk.com is DAIRY
#   FARMERS OF AMERICA's host, not Dean Foods'. Nothing it serves is creditable to
#   Dean Foods, and nothing was credited.
#
# NO WellKnown and NO SecurityTxt pointer is emitted in apis.yml. A pointer asserts
# that the PROVIDER serves that surface; not one document was served by anyone.

